# Base configuration, used as-is in production. The datasource is supplied only through
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# Profiles: 'local' (Docker Compose) and 'test'. There is deliberately no 'prod' profile (D24).
spring:
  application:
    name: url-shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # D59: a misspelled field (for example "alais") must fail, not silently create a random code.
      fail-on-unknown-properties: true
    parser:
      # D59: duplicate keys are a parser-differential risk (a proxy may read the first, the app the last).
      strict-duplicate-detection: true
  datasource:
    hikari:
      # D131: fail fast when the pool is exhausted (was Hikari's 30 s default), so a redirect does not hang.
      connection-timeout: 3000
      data-source-properties:
        # D64: no row values (URLs, usernames) in pgjdbc exception messages or logs.
        logServerErrorDetail: false
server:
  # US-014 H5 (D37): trust X-Forwarded-For/-Proto only from internal proxies (Tomcat's default: private and
  # loopback ranges). Override with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES for the real load balancer.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
management:
  endpoints:
    web:
      # US-014 H6: every endpoint but health, and the /actuator links page itself, is ADMIN-only in SecurityConfig.
      # Discovery stays enabled on purpose: with it disabled, an ADMIN's GET /actuator would fall through to the
      # public /{code} redirect mapping.
      exposure:
        # H13: metrics carries shortener.clicks.lost (ADMIN-only).
        include: health, metrics
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  pattern:
    # US-014 AC1: every log line carries the request ID (blank outside a request).
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    # D64: expected unique violations are handled and logged by the service; this also keeps the
    # server's "Failing row contains" detail out of the logs.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "off"
