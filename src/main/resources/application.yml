# Base configuration, used as-is in production. The datasource is supplied only through
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# Profiles: 'local' (Docker Compose) and 'test'. There is deliberately no 'prod' profile (D24).
spring:
  application:
    name: url-shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # D59: a misspelled field (for example "alais") must fail, not silently create a random code.
      fail-on-unknown-properties: true
    parser:
      # D59: duplicate keys are a parser-differential risk (a proxy may read the first, the app the last).
      strict-duplicate-detection: true
  datasource:
    hikari:
      data-source-properties:
        # D64: no row values (URLs, usernames) in pgjdbc exception messages or logs.
        logServerErrorDetail: false
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  level:
    # D64: expected unique violations are handled and logged by the service; this also keeps the
    # server's "Failing row contains" detail out of the logs.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "off"
